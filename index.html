<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎮 Happy Birthday Levi!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #07071a;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 48px;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridScroll 18s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes gridScroll {
            0%   { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* CRT scanlines */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 90;
            background: repeating-linear-gradient(
                0deg, transparent 0px, transparent 3px,
                rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px
            );
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 28px 18px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* ── Header ─────────────────────────────── */
        .header { text-align: center; }

        .stars-row {
            font-size: 12px;
            letter-spacing: 6px;
            color: #ffd700;
            margin-bottom: 14px;
            animation: starPulse 2s ease-in-out infinite;
        }
        @keyframes starPulse {
            0%,100% { text-shadow: 0 0 8px #ffd700; opacity: 1; }
            50%      { text-shadow: 0 0 22px #ffd700; opacity: 0.8; }
        }

        h1 {
            font-size: 14px;
            line-height: 1.9;
            color: #00f5ff;
            text-shadow: 0 0 14px #00f5ff, 0 0 32px #00f5ff88;
        }

        .subtitle {
            font-size: 7px;
            color: #666;
            margin-top: 10px;
            line-height: 2;
        }

        /* ── Wheel ──────────────────────────────── */
        .wheel-section {
            position: relative;
            width: 100%;
            max-width: 360px;
            padding-top: 18px;
        }

        .pointer {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff3366;
            filter: drop-shadow(0 0 10px #ff3366) drop-shadow(0 2px 5px rgba(0,0,0,0.9));
        }

        canvas {
            display: block;
            width: 100%; height: auto;
            border-radius: 50%;
            box-shadow:
                0 0 0 4px #12122e,
                0 0 0 7px #00f5ff33,
                0 0 40px #00f5ff22,
                0 0 80px #00f5ff11;
        }

        /* ── Spin button ────────────────────────── */
        .spin-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #fff;
            background: linear-gradient(180deg, #cc00ff, #7700cc);
            border: none;
            border-radius: 10px;
            padding: 18px 0;
            width: 100%;
            max-width: 280px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 6px 0 #440088, 0 0 24px #cc00ff55;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .spin-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0 0 #440088, 0 0 24px #cc00ff55;
        }
        .spin-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .hint {
            font-size: 7px;
            color: #444;
            text-align: center;
            line-height: 2.2;
        }

        /* ── Modal overlay ──────────────────────── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.87);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .overlay.visible { opacity: 1; pointer-events: all; }

        .modal {
            background: #0d0d26;
            border: 2px solid #00f5ff;
            border-radius: 16px;
            padding: 32px 20px 26px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            transform: scale(0.82) translateY(24px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .overlay.visible .modal { transform: scale(1) translateY(0); }

        .modal.lose-style { border-color: #ff4466; box-shadow: 0 0 40px #ff446622; }
        .modal.win-style  { border-color: #ffd700; box-shadow: 0 0 60px #ffd70033, 0 0 120px #ffd70011; }

        .modal-icon  { font-size: 54px; line-height: 1; margin-bottom: 16px; }
        .modal-title { font-size: 11px; line-height: 1.8; margin-bottom: 14px; }
        .lose-color  { color: #ff4466; }
        .win-color   { color: #ffd700; text-shadow: 0 0 16px #ffd700; }

        .modal-body {
            font-size: 8px;
            color: #aaa;
            line-height: 2.3;
            margin-bottom: 24px;
        }

        .modal-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            cursor: pointer;
        }
        .modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .lose-btn { background: linear-gradient(180deg, #ff4466, #cc1133); box-shadow: 0 4px 0 #880022; }
        .win-btn  { background: linear-gradient(180deg, #00cc66, #008844); box-shadow: 0 4px 0 #004422; }

        /* ── Video ──────────────────────────────── */
        .video-wrap {
            margin: 14px 0 20px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-wrap video { width: 100%; display: block; }
        .video-ph {
            font-size: 7px;
            color: #444;
            text-align: center;
            line-height: 2.4;
            padding: 12px;
        }

        /* ── Confetti ───────────────────────────── */
        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
        .cf {
            position: absolute;
            animation: cfFall linear forwards;
        }
        @keyframes cfFall {
            0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
        }
    </style>
</head>
<body>
<div class="scanlines"></div>
<div id="confetti"></div>

<div class="container">
    <div class="header">
        <div class="stars-row">★ ★ ★ ★ ★</div>
        <h1>HAPPY BIRTHDAY<br>LEVI! 🎮</h1>
        <p class="subtitle">Dreh das Rad und gewinne das Geheimnis...</p>
    </div>

    <div class="wheel-section">
        <div class="pointer"></div>
        <canvas id="wheel" width="360" height="360"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn">▶ DREHEN! ◀</button>

    <p class="hint">
        1 von 10 Chance · Unlimted Spins<br>
        Du schaffst das, Levi... vielleicht 😏
    </p>
</div>

<!-- Lose modal -->
<div class="overlay" id="loseOverlay">
    <div class="modal lose-style">
        <div class="modal-icon" id="loseIcon">😬</div>
        <div class="modal-title lose-color" id="loseTitle">LEIDER NEIN!</div>
        <div class="modal-body" id="loseBody">Versuch's nochmal!</div>
        <button class="modal-btn lose-btn" id="loseBtn">NOCHMAL! →</button>
    </div>
</div>

<!-- Win modal -->
<div class="overlay" id="winOverlay">
    <div class="modal win-style">
        <div class="modal-icon">🏆</div>
        <div class="modal-title win-color">DU HAST GEWONNEN!</div>
        <div class="modal-body">
            Die Force ist mit dir, Levi!<br>
            Schau das Video für den<br>
            nächsten Hinweis...
        </div>

        <div class="video-wrap">
            <!--
            ════════════════════════════════════════════
            VIDEO EINSETZEN – ersetze den Platzhalter:

            Option A – lokale MP4-Datei (einfachste):
                Lege "video.mp4" in denselben Ordner wie index.html,
                dann ändere den Platzhalter zu:

                <video controls playsinline autoplay>
                    <source src="video.mp4" type="video/mp4">
                </video>

            Option B – Google Drive:
                1. Video hochladen → "Link teilen" aktivieren
                2. Link: https://drive.google.com/file/d/FILE_ID/view
                3. Embed-URL: https://drive.google.com/file/d/FILE_ID/preview
                Dann:
                <iframe src="https://drive.google.com/file/d/FILE_ID/preview"
                    width="100%" height="100%" allow="autoplay" frameborder="0"></iframe>

            Option C – YouTube (Unlisted):
                <iframe src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1"
                    width="100%" height="100%" frameborder="0"
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
            ════════════════════════════════════════════
            -->
            <iframe
                src="https://www.youtube.com/embed/vz6I2AQ3fMo?autoplay=1"
                width="100%" height="100%"
                frameborder="0"
                allow="autoplay; encrypted-media"
                allowfullscreen>
            </iframe>
        </div>

        <button class="modal-btn win-btn" id="winBtn">WEITER SPIELEN</button>
    </div>
</div>

<script>
// ── Segmente ────────────────────────────────────────────────────
const SEGMENTS = [
    { label: 'WIN! 🏆',  color: '#FFD700', tc: '#111', win: true  },
    { label: 'NOPE',     color: '#E84545', tc: '#fff', win: false },
    { label: 'LOL 😂',   color: '#F97F23', tc: '#fff', win: false },
    { label: 'FAIL',     color: '#7C3AED', tc: '#fff', win: false },
    { label: 'NEIN',     color: '#2563EB', tc: '#fff', win: false },
    { label: 'NICE TRY', color: '#059669', tc: '#fff', win: false },
    { label: 'OOF',      color: '#DB2777', tc: '#fff', win: false },
    { label: 'NOPE',     color: '#991B1B', tc: '#fff', win: false },
    { label: 'ECHT?',    color: '#0E7490', tc: '#fff', win: false },
    { label: 'KNAPP!',   color: '#6D28D9', tc: '#fff', win: false },
];

// 9 Lose-Nachrichten, cycling
const LOSE = [
    {
        icon: '😂', title: 'L WIE LEVI!',
        body: '"L" steht für Levi...\nund für Loser! 😂\nAber hey – zumindest\nsind deine Nikes cool.'
    },
    {
        icon: '🎮', title: 'SKILL ISSUE!',
        body: 'Du hast eine VR-Brille\nund verlierst trotzdem?\nSelbst in VR bist\ndu ein Verlierer! 💀'
    },
    {
        icon: '⚔️', title: 'USE THE FORCE...',
        body: 'Obi-Wan sagt:\n"Ich habe versagt.\nDu hast schon wieder\nverloren, Padawan." 🙈'
    },
    {
        icon: '👟', title: 'NICE SHOES THO',
        body: 'Deine Nikes können\nschnell weglaufen –\naber nicht schnell genug\num zu gewinnen!'
    },
    {
        icon: '🥽', title: 'VR HILFT DIR NICHT',
        body: 'Keine VR-Brille der\nWelt hilft dir hier!\nReal life, Levi.\nR – E – A – L. 😬'
    },
    {
        icon: '🌌', title: 'FAR FAR AWAY...',
        body: 'In einer weit, weit\nentfernten Galaxis...\nverlierst du auch.\nYoda: "Peinlich." 😅'
    },
    {
        icon: '😏', title: 'DA GEHT MEHR!',
        body: 'Dein Potenzial ist so\ngross wie deine\nSneaker-Sammlung.\nSchade, hilft nichts. 🤷'
    },
    {
        icon: '😬', title: 'PADAWAN FEHLER!',
        body: 'Jedi fürchten keine\nNiederlage...\nGut so, denn davon\nwirst du viele haben!'
    },
    {
        icon: '💀', title: 'RESPAWN IN 3...',
        body: '6h VR zocken...\nund trotzdem versagen.\nFast so schlimm\nwie Hausaufgaben. 💀'
    },
];

// ── Canvas-Setup ────────────────────────────────────────────────
const canvas = document.getElementById('wheel');
const ctx    = canvas.getContext('2d');
const N      = SEGMENTS.length;
const ARC    = (2 * Math.PI) / N;

let rot      = 0;   // current rotation
let spinning = false;
let loseIdx  = 0;   // which lose message comes next

// ── Rad zeichnen ────────────────────────────────────────────────
function draw() {
    const W = canvas.width, cx = W / 2, cy = W / 2, R = W / 2 - 6;
    ctx.clearRect(0, 0, W, W);

    // Segments
    for (let i = 0; i < N; i++) {
        const a0 = rot + i * ARC, a1 = a0 + ARC;
        const s  = SEGMENTS[i];

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, a0, a1);
        ctx.closePath();
        ctx.fillStyle = s.color;
        ctx.fill();
        ctx.strokeStyle = '#07071a';
        ctx.lineWidth = 2;
        ctx.stroke();

        // WIN bekommt einen Goldschimmer
        if (s.win) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, R, a0, a1);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,200,0.18)';
            ctx.fill();
            ctx.restore();
        }

        // Label
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a0 + ARC / 2);
        ctx.textAlign    = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = s.tc;
        ctx.shadowColor  = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur   = 5;
        ctx.font = s.win
            ? 'bold 10px "Press Start 2P", monospace'
            : '8px "Press Start 2P", monospace';
        ctx.fillText(s.label, R - 13, 0);
        ctx.restore();
    }

    // Äußerer Ring
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 2 * Math.PI);
    ctx.strokeStyle = '#00f5ff55';
    ctx.lineWidth = 6;
    ctx.stroke();

    // Mittelpunkt
    const g = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, 26);
    g.addColorStop(0, '#3a3a6e');
    g.addColorStop(1, '#0d0d26');
    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, 2 * Math.PI);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#00f5ff';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.font         = '18px sans-serif';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor  = '#00f5ff';
    ctx.shadowBlur   = 12;
    ctx.fillText('⭐', cx, cy);
    ctx.shadowBlur   = 0;
}
draw();

// ── Easing ──────────────────────────────────────────────────────
const easeOut   = t => 1 - Math.pow(1 - t, 4);
const easeInOut = t => t < 0.5
    ? 4 * t * t * t
    : 1 - Math.pow(-2 * t + 2, 3) / 2;

// ── Animations-Helper ───────────────────────────────────────────
function animateTo(target, ms, ease, done) {
    const start = rot, t0 = performance.now();
    (function frame(now) {
        const p = Math.min((now - t0) / ms, 1);
        rot = start + (target - start) * ease(p);
        draw();
        p < 1 ? requestAnimationFrame(frame) : (rot = target, draw(), done?.());
    })(t0);
}

// Berechnet Ziel-Rotation: Segment segIdx zeigt oben auf den Zeiger,
// mit extraRounds zusätzlichen Umdrehungen.
function targetFor(segIdx, extraRounds) {
    const base  = -Math.PI / 2 - segIdx * ARC - ARC / 2;
    let   delta = ((base - rot) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    if (delta < 0.12) delta += 2 * Math.PI; // mindestens etwas drehen
    return rot + delta + extraRounds * 2 * Math.PI;
}

// ── UI-Helfer ────────────────────────────────────────────────────
const spinBtn     = document.getElementById('spinBtn');
const loseOverlay = document.getElementById('loseOverlay');
const winOverlay  = document.getElementById('winOverlay');
const loseBtnEl   = document.getElementById('loseBtn');
const winBtnEl    = document.getElementById('winBtn');

function lock()   { spinning = true;  spinBtn.disabled = true;  }
function unlock() { spinning = false; spinBtn.disabled = false; }

function openLose(icon, title, body, btnDisabled) {
    document.getElementById('loseIcon').textContent  = icon;
    document.getElementById('loseTitle').textContent = title;
    document.getElementById('loseBody').innerHTML    = body.replace(/\n/g, '<br>');
    loseBtnEl.disabled    = !!btnDisabled;
    loseBtnEl.textContent = btnDisabled ? '...' : 'NOCHMAL! →';
    loseOverlay.classList.add('visible');
}
function closeLose() {
    loseOverlay.classList.remove('visible');
    unlock();
}
function openWin() {
    winOverlay.classList.add('visible');
    spawnConfetti();
}
function closeWin() {
    winOverlay.classList.remove('visible');
    unlock();
}

loseBtnEl.addEventListener('click', () => { if (!loseBtnEl.disabled) closeLose(); });
winBtnEl.addEventListener('click', closeWin);

// ── Hauptlogik: Drehen ───────────────────────────────────────────
spinBtn.addEventListener('click', () => {
    if (spinning) return;
    lock();

    const isWin = Math.random() < 0.1; // 10% Gewinnchance

    if (!isWin) {
        // Zufälliges Lose-Feld (Segment 1–9)
        const seg    = 1 + Math.floor(Math.random() * (N - 1));
        const target = targetFor(seg, 5 + Math.floor(Math.random() * 4));

        animateTo(target, 4000 + Math.random() * 800, easeOut, () => {
            const m = LOSE[loseIdx % LOSE.length];
            loseIdx++;
            setTimeout(() => openLose(m.icon, m.title, m.body, false), 350);
        });

    } else {
        // ═══ PRANK-SEQUENZ ═══
        // Schritt 1: Schnell drehen → auf WIN landen
        const winTarget = targetFor(0, 5 + Math.floor(Math.random() * 4));

        animateTo(winTarget, 4500, easeOut, () => {
            // Schritt 2: Kurze Pause, dann langsam ein Feld weiter (→ Segment 9, LOSE)
            setTimeout(() => {
                animateTo(rot + ARC, 1800, easeInOut, () => {
                    // Schritt 3: Prank-Modal anzeigen (Button deaktiviert)
                    openLose('😱', 'KNAPP DANEBEN...', 'So nah...\nund doch so weit.\nDas Schicksal ist\ngrausam... oder? 🤔', true);

                    // Schritt 4: Nach 2,8s → echten WIN enthüllen
                    setTimeout(() => {
                        loseOverlay.classList.remove('visible');
                        setTimeout(() => {
                            // Langsam eine Runde drehen → auf WIN
                            animateTo(targetFor(0, 1), 2800, easeInOut, () => {
                                setTimeout(openWin, 400);
                            });
                        }, 400);
                    }, 2800);
                });
            }, 600);
        });
    }
});

// ── Konfetti ────────────────────────────────────────────────────
function spawnConfetti() {
    const el     = document.getElementById('confetti');
    const colors = ['#ffd700','#ff0080','#00f5ff','#a855f7','#10b981','#f97316','#ef4444'];

    for (let i = 0; i < 80; i++) {
        const p = document.createElement('div');
        p.className = 'cf';
        const size = 6 + Math.random() * 10;
        p.style.cssText = [
            `left:${Math.random() * 100}vw`,
            `top:-20px`,
            `width:${size}px`,
            `height:${size}px`,
            `background:${colors[i % colors.length]}`,
            `border-radius:${Math.random() > 0.5 ? '50%' : '2px'}`,
            `animation-duration:${1.5 + Math.random() * 2.5}s`,
            `animation-delay:${Math.random() * 0.8}s`,
        ].join(';');
        el.appendChild(p);
    }
    setTimeout(() => el.innerHTML = '', 5000);
}
</script>
</body>
</html>
